<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost your way — Netflix Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #141414; }
    .lost { text-align: center; padding: 40px 6%; max-width: 760px; }
    .lost .code { color: #e50914; font-size: 15px; font-weight: 800; letter-spacing: 0.3em; }
    .lost h1 { font-size: clamp(40px, 7vw, 88px); font-weight: 900; margin: 14px 0 12px; letter-spacing: -0.04em; }
    .lost p { color: #b3b3b3; font-size: 17px; margin-bottom: 30px; }
    .lost a { display: inline-flex; align-items: center; height: 46px; padding: 0 26px; background: #fff; color: #000; border-radius: 4px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="lost">
    <div class="code">LOST YOUR WAY?</div>
    <h1>404</h1>
    <p>Sorry, we can't find that page. You'll find lots to explore on the home page.</p>
    <a href="/">Netflix Home</a>
  </div>
</body>
</html>
