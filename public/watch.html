<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>Netflix Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Cpath d='M9 6h5l6 13V6h4v20h-5L13 13v13H9z' fill='%23e50914'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/watch.css">
</head>
<body class="player-body">
  <div class="player" id="player">
    <video id="video" playsinline preload="metadata"></video>

    <div class="player-loading" id="playerLoading">
      <div class="spinner"></div>
    </div>

    <div class="player-error" id="playerError" hidden>
      <div class="error-inner">
        <div class="error-n">N</div>
        <h1>This title can't be played</h1>
        <p id="errorText">The browser could not decode this file. Try an MP4 (H.264/AAC) file, or open another title.</p>
        <a class="btn-home" href="/">Back to Netflix Home</a>
      </div>
    </div>

    <div class="player-ui" id="playerUI">
      <div class="top-bar">
        <button class="back-btn" id="backBtn" aria-label="Back to browse">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m6-7-7 7 7 7"/></svg>
        </button>
        <div class="top-title">
          <span class="top-kicker" id="topKicker">NETFLIX HOME</span>
          <h1 id="videoTitle"></h1>
        </div>
      </div>

      <button class="center-play" id="centerPlay" aria-label="Play">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor"><path d="M6 4.5v15l13-7.5z"/></svg>
      </button>

      <div class="resume-toast" id="resumeToast" hidden></div>

      <div class="bottom-bar">
        <div class="timeline-wrap" id="timelineWrap">
          <div class="tl-track"></div>
          <div class="tl-buffer" id="tlBuffer"></div>
          <div class="tl-played" id="tlPlayed"></div>
          <div class="tl-thumb" id="tlThumb"></div>
          <div class="tl-tooltip" id="tlTooltip" hidden>0:00</div>
        </div>
        <div class="controls">
          <div class="controls-left">
            <button class="ctrl" id="playBtn" aria-label="Pause">
              <svg class="i-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" hidden><path d="M6 4.5v15l13-7.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
            </button>
            <button class="ctrl" id="back10" aria-label="Back 10 seconds">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10a9 9 0 1 1 2.6 8"/><path d="M3 4v6h6"/><text x="12" y="16" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="currentColor" stroke="none">10</text></svg>
            </button>
            <button class="ctrl" id="fwd10" aria-label="Forward 10 seconds">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 10a9 9 0 1 0-2.6 8"/><path d="M21 4v6h-6"/><text x="12" y="16" text-anchor="middle" font-size="7" font-family="Arial" font-weight="bold" fill="currentColor" stroke="none">10</text></svg>
            </button>
            <div class="volume-wrap">
              <button class="ctrl" id="muteBtn" aria-label="Mute">
                <svg class="i-vol" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></svg>
                <svg class="i-mute" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="m16 9 5 6m0-6-5 6"/></svg>
              </button>
              <input type="range" class="vol-slider" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
            </div>
            <span class="time" id="time">0:00 / 0:00</span>
          </div>
          <div class="controls-right">
            <span class="quality" id="qualityTag"></span>
            <button class="ctrl" id="fsBtn" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/watch.js"></script>
</body>
</html>
